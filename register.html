<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | DynamicRent</title>
  <meta name="description" content="Create a new Customer or Property Owner account on DynamicRent.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Minimal Nav -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <span>Dynamic<span class="logo-highlight">Rent</span></span>
      </a>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Alert Notification Banner -->
      <div id="auth-alert-banner" class="alert-banner alert-danger" style="display: none;"></div>

      <div class="auth-header">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
        </div>
        <h1>Create an Account</h1>
        <p>Join DynamicRent to book stays or optimize your rental pricing</p>
      </div>

      <form id="register-form" novalidate>
        <!-- Role Selection -->
        <div class="form-group">
          <label class="form-label">I want to register as:</label>
          <div class="role-selector">
            <div class="role-option">
              <input type="radio" id="reg-role-customer" name="role" value="customer" checked>
              <label for="reg-role-customer" class="role-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                Customer
              </label>
            </div>
            <div class="role-option">
              <input type="radio" id="reg-role-owner" name="role" value="owner">
              <label for="reg-role-owner" class="role-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                  <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Owner
              </label>
            </div>
          </div>
        </div>

        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
          <span id="reg-name-error" class="field-error" style="display: none;"></span>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
          <span id="reg-email-error" class="field-error" style="display: none;"></span>
        </div>

        <!-- Password with Eye Toggle -->
        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required>
            <button type="button" class="toggle-password-btn" data-target="reg-password" title="Show/Hide Password" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span id="reg-password-error" class="field-error" style="display: none;"></span>
        </div>

        <!-- Confirm Password with Eye Toggle -->
        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required>
            <button type="button" class="toggle-password-btn" data-target="reg-confirm-password" title="Show/Hide Password" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span id="reg-confirm-password-error" class="field-error" style="display: none;"></span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="register-submit-btn" style="margin-top: 10px;">
          <span>Create Account</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>

      <div style="text-align: center;">
        <a href="index.html" class="back-home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Home
        </a>
      </div>
    </div>
  </main>

  <script src="js/shared/toast.js"></script>
  <script src="js/data/userData.js"></script>
  <script src="js/auth/register.js"></script>
</body>
</html>
